name: unzip-project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q mudhakirat-premium-cards.zip
          rsync -a --exclude='.github' mudhakirat-main/ ./
          rm -rf mudhakirat-main mudhakirat-premium-cards.zip
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "add project files"
          git push
